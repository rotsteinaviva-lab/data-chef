  <!-- AUTOMATED TAGS DISPLAY (Right beneath the title) -->
    {% if post.tags.size > 0 %}
      <p class="page__meta" style="margin-top: -5px; margin-bottom: 10px;">
        <i class="fas fa-tags" aria-hidden="true"></i>
        {% for tag in post.tags %}
          <a href="{{ tag | slugify | prepend: '/tags/#' | relative_url }}" class="page__meta-tag" style="text-decoration: none; background: rgba(0, 122, 204, 0.08); color: #007acc; padding: 2px 6px; border-radius: 4px; margin-right: 4px; font-size: 13px;">
            {{ tag }}
          </a>
        {% endfor %}
      </p>
    {% endif %}
