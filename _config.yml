title: Data Chef
description: Welcome to my new GitHub blog page!
remote_theme: "mmistakes/minimal-mistakes@4.28.0"
plugins:
  - jekyll-include-cache

minimal_mistakes_skin: "dark" # Options: "air", "aqua", "contrast", "dark", "dir", "neon", "mint", "sunrise"

defaults:
  # _pages
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
  # _posts
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

      
